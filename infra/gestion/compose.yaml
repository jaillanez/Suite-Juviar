# Gestión en el servidor. La versión la elige infra/desplegar.sh (variable VERSION).
name: suite-juviar-gestion
services:
  gestion:
    image: suite-juviar-gestion:${VERSION:?falta VERSION}
    container_name: suite-juviar-gestion
    restart: unless-stopped
    env_file: /etc/suite/gestion.env
    volumes:
      - /var/lib/suite-juviar/gestion:/datos
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # edge: entrada por Caddy. tablero: red interna exclusiva con la base DMZ (rol gestion_tablero),
    # sin la base principal de la suite.
    networks: [edge, tablero]
networks:
  edge:
    external: true
    name: suite-turnos_edge
  tablero:
    external: true
    name: suite-juviar-tablero
