# Gestión en el servidor. La versión la elige infra/desplegar.sh (variable VERSION).
name: suite-juviar-gestion
services:
  gestion:
    image: suite-juviar-gestion:${VERSION:?falta VERSION}
    container_name: suite-juviar-gestion
    restart: unless-stopped
    env_file: /etc/suite/gestion.env
    volumes:
      - /var/lib/suite-juviar/gestion:/datos
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # edge: entrada por Caddy. fila-dmz: lectura del tablero de la fila (rol gestion_tablero).
    networks: [edge, fila-dmz]
networks:
  edge:
    external: true
    name: suite-turnos_edge
  fila-dmz:
    external: true
    name: suite-juviar-recepcion_default
