    # RIESGO NO CUBIERTO POR EL CATÁLOGO — leer antes de aprobar este sector.
    # El CO2 de fermentación desplaza el oxígeno. Ningún respirador con filtro
    # protege contra eso: filtran contaminantes, no fabrican oxígeno. Se puede
    # perder la conciencia en menos de minuto y medio y morir en unos tres.
    # Las tareas de descube y limpieza de vasijas son espacio confinado, y ahí
    # rige la Res. SRT 953/2010 con la Norma IRAM 3625: medición de oxígeno y
    # gases ANTES de entrar y desde afuera, ventilación forzada, permiso de
    # trabajo, vigía afuera y equipo de respiración autónomo para emergencia.
    # Eso es procedimiento y equipamiento de sector, no un EPP de entrega
    # individual, y por eso NO figura como línea de esta matriz.
    # La Comisión Cuatripartita de la industria vitivinícola publicó una ficha
    # técnica específica de espacios confinados en bodegas (ProNaPre).

  PRE:
