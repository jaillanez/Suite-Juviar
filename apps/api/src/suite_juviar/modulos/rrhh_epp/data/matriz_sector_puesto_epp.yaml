# ===========================================================================
# MATRIZ DE EPP POR SECTOR Y PUESTO — PROPUESTA, NO VALIDADA
# ===========================================================================
# Los 19 sectores salen de la hoja "esquema" del Excel de ENAV
# ("Elementos de protección personal de uso obligatorio por sector", 2012).
# Los códigos salen del RD 068/11 V 02 real (hoja "Especificaciones").
#
# El cruce sector x elemento NO estaba en el archivo: las columnas quedaron
# vacías. Esta propuesta lo reconstruye. Cada línea lleva su fundamento.
#
# Fundamentos, de más fuerte a más débil:
#   RD 068/11        el propio catálogo declara el destino de ese elemento
#   CCT              entrega estacional obligatoria por convenio
#   RIESGO           riesgo del sector; hay que contrastarlo contra el RGRL
#   PROPUESTA        criterio nuestro. Es lo que HyS tiene que revisar primero.
#
# NADA DE ESTO ES CRITERIO DE PROTECCIÓN VÁLIDO HASTA QUE HIGIENE Y SEGURIDAD
# LO APRUEBE Y FIRME. El sistema lo muestra marcado como propuesta.
# ===========================================================================
