<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulador del bot Juviar</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font:15px system-ui;background:#e9e4dc;height:100vh;display:flex;flex-direction:column}
    header{background:#075e54;color:white;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    header b{margin-right:auto} select,input{font:inherit;padding:8px;border:0;border-radius:7px}
    #aviso{background:#fff3cd;color:#664d03;padding:7px 16px;font-size:13px}
    #chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:7px}
    .m{max-width:75%;padding:9px 12px;border-radius:9px;white-space:pre-wrap;box-shadow:0 1px 1px #0002}
    .yo{align-self:flex-end;background:#dcf8c6}.bot{align-self:flex-start;background:white}.err{align-self:center;background:#f8d7da;color:#842029}
    form{display:flex;gap:8px;padding:11px;background:#f0f0f0}#texto{flex:1;border-radius:20px}
    button{background:#075e54;color:white;border:0;border-radius:20px;padding:0 20px;cursor:pointer}
  </style>
</head>
<body>
  <header><b>Simulador del bot de descargas</b><select id="tel"></select><input id="otro" placeholder="u otro número 549…"></header>
  <div id="aviso">Prueba interna: atraviesa webhook, cola y worker reales. La respuesta no sale por WhatsApp.</div>
  <div id="chat"></div>
  <form id="form"><input id="texto" placeholder="Escribí 1, 2, 3 o cualquier cosa" autocomplete="off"><button>Enviar</button></form>
  <script>
    const $=s=>document.querySelector(s); let ultimo=0;
    const telefono=()=>($('#otro').value.replace(/\D/g,'')||$('#tel').value);
    function burbuja(texto,clase){const d=document.createElement('div');d.className='m '+clase;d.textContent=texto;$('#chat').appendChild(d);$('#chat').scrollTop=1e9}
    async function cargar(){const r=await fetch('/telefonos'),lista=await r.json();$('#tel').innerHTML=lista.map(x=>`<option value="${x.telefono}">${x.telefono} · ${x.productores} productor(es)</option>`).join('')||'<option value="">(sin vínculos)</option>'}
    async function sondear(){const t=telefono();if(!t)return;try{const r=await fetch(`/respuestas?telefono=${t}&desde_id=${ultimo}`);for(const m of await r.json()){ultimo=m.id;burbuja(m.texto,'bot')}}catch{}}
    function reiniciar(){ultimo=0;$('#chat').innerHTML='';const t=telefono();if(t)fetch(`/respuestas?telefono=${t}&desde_id=0`).then(r=>r.json()).then(l=>{if(l.length)ultimo=l.at(-1).id})}
    $('#tel').onchange=reiniciar;$('#otro').onchange=reiniciar;
    $('#form').onsubmit=async e=>{e.preventDefault();const texto=$('#texto').value.trim(),t=telefono();if(!texto||!t)return;$('#texto').value='';burbuja(texto,'yo');const r=await fetch('/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefono:t,texto})});if(!r.ok)burbuja(`Error ${r.status}: ${await r.text()}`,'err')};
    cargar().then(reiniciar);setInterval(sondear,1000);
  </script>
</body></html>
